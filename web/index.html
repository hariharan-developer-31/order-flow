<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>TRADING BOY | Live Order Flow, Volume Profile & Footprint Terminal</title>

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TradingBoy" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              'xs': '420px',
              '3xl': '1920px',
              '4k': '2560px',
            },
            fontFamily: {
              headline: ['"Inter Tight"', 'sans-serif'],
              sans: ['"Inter Tight"', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              nearblack: '#0D0D0C',
              cream: {
                DEFAULT: '#FFFFFF',
                50: '#FFFFFF',
                100: '#FFFFFF',
                200: '#F8F9FA',
                300: '#ECE5D8',
                400: '#DFD5C4',
                500: '#C8BAA2',
              },
              pastel: {
                lemon: '#FFFFFF',
                lemonTo: '#FFFFFF',
                peach: '#FFFFFF',
                peachTo: '#FFFFFF',
                sage: '#FFFFFF',
                sageTo: '#FFFFFF',
                rose: '#FFFFFF',
                roseTo: '#FFFFFF',
              },
              accent: {
                lemon: '#E9C22E',
                peach: '#F2772F',
                sage: '#3FB874',
                rose: '#C564C4',
              },
              brand: {
                50: '#FFFFFF',
                100: '#F8F9FA',
                500: '#0D0D0C',
                600: '#0D0D0C',
                700: '#000000',
              },
              trade: {
                green: '#3FB874',
                red: '#F2772F',
                poc: '#E9C22E',
                va: '#0D0D0C',
              },
            },
            borderRadius: {
              DEFAULT: '7px',
              refined: '7px',
              'ref-sm': '5px',
              'ref-lg': '12px',
              'ref-xl': '16px',
            },
            transitionDuration: {
              enter: '500ms',
              exit: '420ms',
              bg: '770ms',
            },
            transitionTimingFunction: {
              fintech: 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --color-nearblack: #0D0D0C;
        --color-cream: #FFFFFF;
        --color-cream-subtle: #F8F9FA;
        --color-text-primary: #0D0D0C;
        --color-text-secondary: rgba(13, 13, 12, 0.56);
        --color-text-helper: rgba(13, 13, 12, 0.42);
        --radius-ref: 7px;
        --ease-fintech: cubic-bezier(0.16, 1, 0.3, 1);
        --ref-scale: min(100vw / 1440, 100vh / 960);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        color: #0D0D0C;
        font-family: 'Inter Tight', 'Inter', sans-serif;
      }
      #root {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        background-color: #FFFFFF;
      }

      /* Subtle 18% Fractal Noise Texture Overlay */
      .bg-grain-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.0;
        display: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Coordinated Pastel Gradients */
      .grad-lemon {
        background: #FFFFFF;
      }
      .grad-peach {
        background: #FFFFFF;
      }
      .grad-sage {
        background: #FFFFFF;
      }
      .grad-rose {
        background: #FFFFFF;
      }

      /* Soft Radial Glows */
      /* radial glow removed */
      /* radial glow removed */
      /* radial glow removed */
      /* radial glow removed */

      /* Warm Editorial Typography Hierarchy */
      .font-editorial-headline {
        font-family: 'Inter Tight', sans-serif;
        font-size: clamp(2.5rem, calc(172px * min(100vw / 1440, 1)), 172px);
        line-height: 0.86;
        letter-spacing: -0.032em;
        font-weight: 500;
      }
      .font-wordmark {
        font-family: 'Inter Tight', sans-serif;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.1;
      }
      .font-nav {
        font-family: 'Inter Tight', sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .font-supporting {
        font-family: 'Inter Tight', sans-serif;
        font-size: 18.5px;
        line-height: 1.42;
        letter-spacing: -0.015em;
        color: rgba(13, 13, 12, 0.56);
      }
      .font-heading-2 {
        font-family: 'Inter Tight', sans-serif;
        font-size: clamp(22px, 2.2vw, 29px);
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.15;
      }
      .font-metric-prominent {
        font-family: 'Inter Tight', sans-serif;
        font-size: clamp(32px, 4vw, 54px);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 0.95;
      }
      .font-metric-label {
        font-family: 'Inter Tight', sans-serif;
        font-size: 16.5px;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .font-helper {
        font-family: 'Inter Tight', sans-serif;
        font-size: 15px;
        color: rgba(13, 13, 12, 0.42);
        letter-spacing: -0.01em;
      }

      /* Opacity Specifications */
      .text-secondary {
        color: rgba(13, 13, 12, 0.56);
      }
      .text-helper {
        color: rgba(13, 13, 12, 0.42);
      }

      /* Warm Minimalist Buttons & Components */
      .btn-refined {
        border: 1px solid rgba(13, 13, 12, 0.16);
        border-radius: 7px;
        transition: all 500ms cubic-bezier(0.16, 1, 0.3, 1);
        background-color: #FFFFFF;
        color: #0D0D0C;
      }
      .btn-refined:hover {
        background-color: #0D0D0C;
        color: #FFFFFF;
        border-color: #0D0D0C;
      }
      .btn-refined-active {
        background-color: #0D0D0C;
        color: #FFFFFF;
        border-color: #0D0D0C;
      }

      .card-refined {
        background-color: #FFFFFF;
        border: 1px solid rgba(13, 13, 12, 0.14);
        border-radius: 7px;
        transition: all 500ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .card-refined:hover {
        border-color: rgba(13, 13, 12, 0.3);
      }

      /* Keyframe animations */
      @keyframes fadeRise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-rise {
        animation: fadeRise 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes floatGentle {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      .animate-float {
        animation: floatGentle 5s ease-in-out infinite;
      }

      @keyframes driftGlow {
        0%, 100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(12px, -8px) scale(1.05);
        }
      }
      .animate-drift {
        animation: driftGlow 14s ease-in-out infinite;
      }

      /* Respect prefers-reduced-motion */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .animate-float, .animate-drift, .animate-fade-rise {
          animation: none !important;
        }
      }

      /* Custom Scrollbar for Warm Minimalist Theme */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #FFFFFF;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(13, 13, 12, 0.15);
        border-radius: 7px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(13, 13, 12, 0.3);
      }
    </style>
  </head>
  <body class="bg-white text-[#0D0D0C] antialiased min-h-screen overflow-x-hidden w-full max-w-full font-sans selection:bg-[#0D0D0C] selection:text-white">

    <!-- Clean White Background -->

</html>
